name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      AETHER_DATA_DIR: ${{ runner.temp }}/aether-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Install YARA (optional dependency)
        run: python -m pip install -r requirements-yara.txt
        continue-on-error: true
      - name: Unit tests
        run: python manage.py test edr
      # Runs the real collector against a real child process: memory map, RWX detection, sockets,
      # process start notifications. On the Windows runner this exercises VirtualQueryEx,
      # the protected-process query and the WMI watcher.
      - name: Self-test on this OS
        run: python -m edr.selftest

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
