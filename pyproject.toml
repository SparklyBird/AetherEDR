[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheredr"
version = "1.0.0"
description = "AetherEDR - standalone endpoint detection and response platform"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "License :: Other/Proprietary License",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
  "Django>=5.1,<7",
  "djangorestframework>=3.15",
  "psutil>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "Jinja2>=3.1",
  "whitenoise>=6.6",
  "waitress>=3.0",
]

[project.optional-dependencies]
yara = ["yara-python>=4.5"]

[project.scripts]
aetheredr = "aether.launcher:main"

[tool.setuptools.packages.find]
include = ["aether*", "edr*"]

[tool.setuptools.package-data]
edr = ["yara_rules/*.yar", "reporting/templates/*"]
